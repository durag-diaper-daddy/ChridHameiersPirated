<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chrid Hameier's Pirated!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: a gilt-framed window onto a sunlit 3D Caribbean; navy-and-gold lacquer panels float over the live scene. */
:root{
  --ink:#061a2e; --navy:#0b2b4d; --navy2:#123e69; --navy3:#1b5389; --gold:#f5c94f; --gold2:#e0a330; --gold3:#8c5c14;
  --cream:#fff6df; --sky:#9fdcf5; --teal:#3cc7c2; --red:#e2583c; --green:#8ad86f; --muted:#b4cbe0;
  --f-display:"Almendra","Palatino Linotype","Book Antiqua",Georgia,serif;
  --f-body:"Alegreya Sans","Gill Sans","Trebuchet MS",sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:#04121f;color:var(--cream);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
#app{height:100%;box-sizing:border-box;padding-inline:16px;padding-block:10px;display:flex;flex-direction:column}
#frame{position:relative;flex:1;min-height:0;border-radius:8px;overflow:hidden;background:#86cdee;border:2px solid var(--gold2);box-shadow:0 0 0 1px #3a2606,0 0 0 5px #0b2440,0 0 0 6px rgba(245,201,79,.45)}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gl{cursor:crosshair}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1d6aa6,#082743);font-family:var(--f-display);font-size:22px;color:var(--gold)}
.gold-t{font-family:var(--f-display);font-weight:700;color:var(--gold);text-shadow:0 2px 0 #4a2f06,0 0 2px #2a1a03,0 4px 12px rgba(0,0,0,.45)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pl{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;will-change:transform}
.pl b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.05;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.55),0 0 3px rgba(0,0,0,.65)}
.pl span{display:block;font-size:12.5px;font-weight:700;color:#fff2c6;text-shadow:0 1px 2px rgba(0,0,0,.85)}
.pl.hostile b{color:#ffbfa9}
.pl.ship b{font-size:15px}
.pl.ship span{color:#fff}
#arrow{position:absolute;left:0;top:0;width:0;height:0;border-left:16px solid var(--red);border-top:10px solid transparent;border-bottom:10px solid transparent;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));pointer-events:none}

/* HUD at sea */
.hud{position:absolute;inset:0;pointer-events:none}
.tl{position:absolute;left:14px;top:10px;max-width:calc(100% - 180px)}
.tl .gold-t{font-size:22px;line-height:1.1;display:block}
.tl small{display:block;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);font-size:13px}
.medal{position:absolute;left:12px;bottom:12px;display:flex;align-items:flex-end;gap:10px}
.medal canvas{width:116px;height:116px;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.pills{display:flex;flex-direction:column;gap:5px;padding-bottom:4px}
.pill{display:flex;align-items:center;gap:7px;background:linear-gradient(#174a7c,#0d3157);border:1.5px solid var(--gold2);border-radius:999px;padding:2px 12px 2px 3px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;color:var(--cream);box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
.pill i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a0,#d7962a);display:grid;place-items:center;flex:none}
.pill i svg{width:15px;height:15px;stroke:#4a2a05;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill.warn{border-color:var(--red);color:#ffd2c6}
.date{font-family:var(--f-display);font-weight:700;font-size:16px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.75)}
.minimap{position:absolute;right:12px;top:12px;width:132px;height:132px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}

/* battle HUD */
.bcard{position:absolute;top:10px;width:min(300px,calc(50% - 20px));padding:8px 12px 10px;border-radius:10px;background:linear-gradient(rgba(18,62,105,.92),rgba(9,37,66,.92));border:1.5px solid var(--gold2);box-shadow:0 4px 14px rgba(0,0,0,.35);box-sizing:border-box}
.bcard.l{left:10px}.bcard.r{right:10px}
.bcard .gold-t{font-size:17px;line-height:1.15;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:5px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.bars span{color:var(--muted)}
.bars .b{height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.bars .b i{display:block;height:100%;border-radius:4px}
.guns{display:flex;gap:10px;font-size:12.5px;font-weight:700;margin-top:6px}
.guns span{display:flex;align-items:center;gap:5px}
.guns span::before{content:"";width:9px;height:9px;border-radius:50%;background:#e2583c;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.guns span.ready::before{background:#8ad86f}
.banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:clamp(22px,4vw,38px);text-align:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}

/* duel HUD */
.dtop{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;width:min(720px,calc(100% - 24px))}
.dtop canvas{width:64px;height:80px;border-radius:8px;border:2px solid var(--gold2);box-shadow:0 4px 10px rgba(0,0,0,.4);flex:none;background:#122}
.dmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.dnames{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.dnames span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar{position:relative;height:16px;border-radius:9px;background:linear-gradient(90deg,#2a7fc4,#2a7fc4 50%,#c63b2a 50%);border:2px solid var(--gold2);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.dbar i{position:absolute;top:-6px;width:4px;height:24px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 0 2px #2a1a03;transition:left .15s}
.guard{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;transform:rotate(45deg);border:2px solid rgba(255,255,255,.55);background:rgba(10,30,50,.4);pointer-events:none}
.guard.on{background:var(--gold);border-color:#fff7d0}
.guard.warn{background:var(--red);border-color:#ffe0d8;box-shadow:0 0 12px var(--red)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}

#prompt{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:linear-gradient(#ffe08a,#e2a32f);color:#3a2205;border:2px solid #fff1b8;border-radius:999px;padding:8px 22px;font-family:var(--f-display);font-weight:700;font-size:18px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.4);white-space:nowrap;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis}
#prompt:focus-visible{outline:3px solid #fff;outline-offset:2px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none;white-space:nowrap;max-width:calc(100% - 300px);overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:linear-gradient(rgba(18,62,105,.95),rgba(9,37,66,.95));border:1.5px solid var(--gold2);padding:8px 18px;border-radius:10px;font-family:var(--f-display);font-size:17px;max-width:min(560px,calc(100% - 32px));text-align:center;pointer-events:none;transition:opacity .4s;box-shadow:0 6px 18px rgba(0,0,0,.35)}

/* action buttons */
#pad{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap-reverse;justify-content:flex-end;max-width:calc(100% - 200px);pointer-events:none}
#pad .grp{display:flex;gap:7px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
#pad button{width:60px;height:60px;border-radius:50%;border:2px solid var(--gold2);background:radial-gradient(circle at 40% 30%,#2b6ca8,#0e355e);color:var(--cream);font:700 11.5px/1.05 var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 0 0 2px rgba(0,0,0,.25);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
#pad button svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#pad button.on{background:radial-gradient(circle at 40% 30%,#ffe08a,#d9951f);color:#3a2205}
#pad button.on svg{stroke:#3a2205}
#pad button.fire{background:radial-gradient(circle at 40% 30%,#e8754f,#9b2a17)}
#pad button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#pad .coarse{display:none}
@media (hover:none),(pointer:coarse){#pad .coarse{display:flex}#hint{display:none}}
@media (max-width:620px){.medal canvas{width:84px;height:84px}.pill{font-size:13px;padding-right:9px}.pill i{width:20px;height:20px}.minimap{width:96px;height:96px}#pad button{width:52px;height:52px}.tl .gold-t{font-size:18px}.pills .date{display:none}#pad{max-width:calc(100% - 110px)}.medal .pills{display:none}}

/* panels */
#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:linear-gradient(rgba(4,18,31,.30),rgba(4,18,31,.55))}
#panel.side{justify-content:flex-start;background:linear-gradient(90deg,rgba(4,18,31,.55),rgba(4,18,31,0) 75%)}
.sheet{width:100%;max-width:720px;max-height:100%;overflow:auto;box-sizing:border-box;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px;border-radius:12px;
  background:linear-gradient(180deg,rgba(22,70,116,.97),rgba(9,37,66,.98));border:2px solid var(--gold2);
  box-shadow:0 0 0 1px #3a2606,inset 0 0 0 5px rgba(9,37,66,.9),inset 0 0 0 6px rgba(245,201,79,.38),0 26px 70px rgba(0,0,0,.5)}
.sheet.chart{background:linear-gradient(rgba(11,48,86,.84),rgba(8,32,58,.93)),var(--chart,none) center/cover}
#panel.side .sheet{max-width:640px}
.sheet h1{font-size:clamp(34px,6.4vw,60px);line-height:1;margin:0;text-wrap:balance}
.sheet h2{font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;color:var(--gold)}
.sheet p{margin:0;max-width:64ch}
.lede{font-family:var(--f-display);font-style:italic;font-size:18.5px;line-height:1.4}
.sub{color:var(--muted);font-size:13.5px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sky);font-weight:700}
.rule{height:2px;flex:none;background:linear-gradient(90deg,transparent,var(--gold2) 20%,var(--gold) 50%,var(--gold2) 80%,transparent)}
.hd{display:flex;gap:14px;align-items:center}
.hd>div{min-width:0}
.flag{flex:none;width:44px;height:30px;border-radius:2px;box-shadow:0 0 0 2px var(--gold2),0 2px 6px rgba(0,0,0,.4)}
.flag.sm{width:22px;height:15px;box-shadow:0 0 0 1px var(--gold2)}
.flag[data-n=spain]{background:linear-gradient(34deg,transparent 44%,#b52a1f 44% 56%,transparent 56%),linear-gradient(-34deg,transparent 44%,#b52a1f 44% 56%,transparent 56%),#f0c22d}
.flag[data-n=england]{background:linear-gradient(#c8302a,#c8302a) center/100% 22% no-repeat,linear-gradient(#c8302a,#c8302a) center/15% 100% no-repeat,#f5f1e6}
.flag[data-n=france]{background:linear-gradient(#f5f1e6,#f5f1e6) center/100% 18% no-repeat,linear-gradient(#f5f1e6,#f5f1e6) 36% 0/12% 100% no-repeat,#2f5fb8}
.flag[data-n=dutch]{background:linear-gradient(#ec8222 0 33.3%,#f5f1e6 33.3% 66.6%,#2b4a96 66.6%)}
.flag[data-n=pirate]{background:radial-gradient(circle at 50% 45%,#f1ead6 0 17%,transparent 18%),#141414}
.stat{display:flex;flex-wrap:wrap;gap:8px}
.chipv{display:flex;align-items:center;gap:6px;background:rgba(4,20,38,.45);border:1px solid rgba(245,201,79,.45);border-radius:999px;padding:3px 11px 3px 4px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chipv i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a0,#d7962a);display:grid;place-items:center}
.chipv i svg{width:13px;height:13px;stroke:#4a2a05;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chipv small{color:var(--muted);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px}
.sheet button{font:inherit;color:var(--cream);cursor:pointer}
.tile{display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(#1f5c95,#123f6c);border:1.5px solid rgba(245,201,79,.75);border-radius:10px;padding:10px 12px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tile svg{flex:none;width:36px;height:36px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1}
.tile small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.tile:hover:not(:disabled){background:linear-gradient(#2a6dab,#174b80)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile.pri{background:linear-gradient(#ffe08a,#e2a32f);color:#3a2205;border-color:#fff1b8}
.tile.pri svg{stroke:#3a2205}.tile.pri small{color:#6a4510}
.tile.danger{border-color:rgba(226,88,60,.85);background:linear-gradient(#6b2a22,#45180f)}
.tile.danger svg{stroke:#ffb59f}
.sheet button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid rgba(245,201,79,.75);background:linear-gradient(#1f5c95,#123f6c);border-radius:999px;padding:7px 16px;font-weight:700!important;font-size:14px!important}
.btn:hover:not(:disabled){background:linear-gradient(#2a6dab,#174b80)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(#ffe08a,#e2a32f);color:#3a2205;border-color:#fff1b8}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.chip{display:flex;gap:9px;align-items:flex-start;border:1.5px solid rgba(245,201,79,.4);border-radius:10px;padding:9px 10px;background:rgba(4,20,38,.35);cursor:pointer}
.chip input{accent-color:var(--gold);margin-top:4px}
.chip b{font-family:var(--f-display);font-weight:700;font-size:17px;display:block;line-height:1.1}
.chip small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.chip:has(input:checked){background:rgba(245,201,79,.16);border-color:var(--gold)}
.chip:focus-within{outline:2px solid var(--gold);outline-offset:1px}
.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chip.look{flex-direction:column;align-items:stretch;gap:8px;padding:8px}
.chip.look .cap{display:flex;gap:8px;align-items:flex-start}
.portrait{display:block;width:100%;aspect-ratio:4/5;max-width:100%;border-radius:8px;border:2px solid var(--gold2);box-shadow:0 4px 12px rgba(0,0,0,.45);background:#1a2a38;box-sizing:border-box}
.portrait.sm{width:84px;flex:none}
.portrait.md{width:120px;flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);font-weight:700}
label.f input{font:inherit;font-size:18px;letter-spacing:0;text-transform:none;color:var(--cream);background:rgba(4,20,38,.5);border:1.5px solid rgba(245,201,79,.55);border-radius:8px;padding:9px 11px;font-weight:500}
label.f input:focus{outline:2px solid var(--gold);outline-offset:0}
.goodi{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a0,#d7962a);flex:none}
.goodi svg{width:20px;height:20px;stroke:#4a2a05;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.xwrap{overflow-x:auto}
.trade{display:grid;grid-template-columns:minmax(64px,auto) auto auto minmax(150px,1fr) auto auto minmax(64px,auto);align-items:center;gap:7px 8px;font-variant-numeric:tabular-nums;min-width:560px}
.trade .th{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--gold);padding-bottom:4px;border-bottom:2px solid rgba(245,201,79,.5)}
.trade .th.r{text-align:right}
.trade .q{font-size:20px;font-weight:800}
.trade .q.r{text-align:right}
.trade .q small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.trade .good{display:flex;align-items:center;gap:8px;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.1;text-align:left}
.trade .good small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.trade .good small.cheap{color:var(--green)}.trade .good small.dear{color:#ffb38f}
.trade button{min-width:44px;border:1.5px solid rgba(245,201,79,.75);background:linear-gradient(#1f5c95,#123f6c);border-radius:8px;padding:5px 8px;font-size:13px!important;font-weight:700!important;line-height:1.1}
.trade button small{display:block;font-size:11px;color:var(--gold);font-weight:700}
.trade button:hover:not(:disabled){background:linear-gradient(#2a6dab,#174b80)}
.trade button:disabled{opacity:.35;cursor:not-allowed}
.trade .sep{grid-column:1/-1;height:1px;background:rgba(245,201,79,.18)}
.big-num{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:1;color:var(--gold);text-shadow:0 2px 0 #4a2f06,0 4px 12px rgba(0,0,0,.4)}
.rumor{font-family:var(--f-display);font-style:italic;font-size:17px;padding:8px 12px;border-left:3px solid var(--gold2);background:rgba(4,20,38,.3);border-radius:0 8px 8px 0}
.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(4,20,38,.35);border:1px solid rgba(245,201,79,.25);flex-wrap:wrap}
.lrow svg.ship{width:40px;height:28px;stroke:var(--gold);fill:none;stroke-width:1.5;flex:none}
.lrow b{font-family:var(--f-display);font-weight:700;font-size:17px}
.lrow .meta{color:var(--muted);font-size:12.5px}
.meter{width:90px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--gold)}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(245,201,79,.4)}
.pips i.on{background:radial-gradient(circle at 35% 30%,#fff1b8,#d9951f);border-color:#fff1b8}
.tag{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid rgba(245,201,79,.5);font-weight:700}
.tag.war{color:#ffb59f;border-color:rgba(226,88,60,.75)}
.tag.ok{color:var(--green);border-color:rgba(138,216,111,.55)}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px}
.log div{display:grid;grid-template-columns:110px 1fr;gap:10px}
.log div span:first-child{color:var(--sky);font-family:var(--f-display);font-style:italic}
.keys{font-size:12.5px;color:var(--muted);line-height:1.7}
kbd{font-family:var(--f-body);font-size:11.5px;border:1px solid rgba(245,201,79,.55);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--cream)}
.nogl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:#0b2b4d}

function tone(f1,f2,dur,vol,type='triangle'){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+dur);g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);}

/* ================= calendar ================= */
function advanceDays(n){for(let k=0;k<n;k++){S.day+=1;dailyTick();}}
function dailyTick(){
 S.foodAcc+=S.crew/40;
 while(S.foodAcc>=1){S.foodAcc-=1;if(S.cargo.food>0)S.cargo.food--;else{S.morale-=2.5;if(Math.random()<.25&&S.crew>3)S.crew-=1;}}
 if(S.cargo.food<=0&&Math.random()<.08)toast('The provisions are gone. The men are starving.');
 S.morale=clamp(S.morale-.22,0,100);
 if(S.morale<18&&Math.random()<.12&&S.crew>6){const n=Math.max(1,Math.round(S.crew*.05));S.crew-=n;toast(`${n} malcontents slip away in the night.`);}
 S.wind=angNorm(S.wind+rnd(-.16,.16)+angDiff(Math.PI+0.25,S.wind)*.05);
 const m=monthOf(),y=yearOf();if(m!==S.lastMonth){S.lastMonth=m;monthlyTick();}if(y!==S.lastYear){S.lastYear=y;yearlyTick();}}
function monthlyTick(){
 for(const P of S.ports){fixPort(P);for(const k of GKEYS){P.drift[k]=lerp(P.drift[k],rnd(.92,1.08),.35);P.stock[k]=Math.round(lerp(P.stock[k],P.base[k],.35));}P.cash=Math.round(lerp(P.cash,P.cash0,.35));
  P.recruits=Math.min(70,Math.round(P.recruits*.5+P.size*6+S.fame/5+rint(0,6)));P.wealth+=P.size*45;P.garrison=Math.min(P.size*45+40,P.garrison+3);}
 for(let a=0;a<4;a++)for(let b=a+1;b<4;b++){const x=POWERS[a],y=POWERS[b],k=pairKey(x,y);const sp=(x==='spain'||y==='spain');const p=S.wars[k]?(sp?.03:.06):(sp?.06:.025);
  if(Math.random()<p){S.wars[k]=!S.wars[k];const t=`${NATIONS[x].name} and ${NATIONS[y].name} are ${S.wars[k]?'at war':'at peace'}.`;log(t);toast(t,4);}}
 for(const p of POWERS){if(S.standing[p]<=-30&&Math.random()<.5)spawnAI(false,{role:'hunter',nat:p});}
 S.standing[S.nat]=Math.min(S.standing[S.nat]+1,100);save();}
function yearlyTick(){S.age++;if(!S.treasure)spawnAI(false,{role:'treasure',nat:'spain'});if(S.age>=(S.skill==='med'?66:60))retireForced=true;}

/* ================= AI ships at sea ================= */
function routeFor(nat,role){
 const own=S.ports.map((p,i)=>i).filter(i=>S.ports[i].nat===nat);const friendly=S.ports.map((p,i)=>i).filter(i=>!atWar(nat,S.ports[i].nat)||S.ports[i].nat===nat);
 if(role==='treasure')return [5,0];
 if(role==='pirate'){const a=rint(0,PG.length-1);let b=rint(0,PG.length-1);if(b===a)b=(a+3)%PG.length;return [a,b];}
 const from=pick(own.length?own:friendly);let to=pick((role==='warship'?own:friendly).filter(i=>i!==from));if(to==null)to=(from+5)%PG.length;return [from,to];}
function spawnAI(initial,opt={}){
 if(!S)return;let nat=opt.nat,role=opt.role;

 g.font='13px "Alegreya Sans", sans-serif';g.fillStyle='#fff6df';g.textAlign='right';g.fillText(`${dateStr()} · ${flag().name} off ${portName(nearestPort(S.x,S.y))} · click or press M to return`,ox+W*sc-4,14);}
const bar=(lab,v,col,txt)=>`<span>${lab}</span><div class="b"><i style="width:${Math.round(clamp(v,0,1)*100)}%;background:${col}"></i></div><span>${txt}</span>`;
function shipCardHtml(s,title,sub,isP){let h=`<span class="gold-t">${esc(title)}</span><small>${esc(sub)}</small><div class="bars">${bar('Hull',s.hull/s.hullMax,'#f5c94f',Math.round(s.hull/s.hullMax*100)+'%')}${bar('Sails',s.sails/100,'#fff6df',Math.round(s.sails)+'%')}${bar('Crew',s.crew/Math.max(1,s.crew0),'#5fd0c8',Math.round(s.crew))}</div>`;
 if(isP)h+=`<div class="guns"><span class="${s.rl<=0?'ready':''}">Port ${s.rl<=0?'loaded':Math.ceil(s.rl)+'s'}</span><span class="${s.rr<=0?'ready':''}">Stbd ${s.rr<=0?'loaded':Math.ceil(s.rr)+'s'}</span><span style="margin-left:auto">${AMMO[s.ammo].name}</span></div>`;return h;}
function updateHud(){
 const seaOn=S&&!attract&&scene==='sea'&&!panelOpen;hudEl.hidden=!seaOn;
 if(seaOn){const food=Math.floor(S.cargo.food),months=S.crew?food/(S.crew/40)/30:9;
  $('hName').textContent=S.name;const best=POWERS.reduce((b,p)=>S.rank[p]>S.rank[b]?p:b,S.nat);$('hTitle').textContent=S.rank[best]>=2?`${TITLES[S.rank[best]]} · ${NATIONS[best].adj}`:S.rank[best]===1?`Privateer · ${NATIONS[best].adj} commission`:'Free captain';
  $('pGold').innerHTML=`<i>${svg('coin')}</i>${fmt(S.purse)}`;$('pCrew').innerHTML=`<i>${svg('crew')}</i>${S.crew} crew`;$('pFood').innerHTML=`<i>${svg('barrel')}</i>${months>=10?'10+':months.toFixed(1)} months`;$('pFood').className='pill'+(months<.3?' warn':'');$('pCrew').className='pill'+(S.morale<25?' warn':'');
  $('pDate').textContent=dateStr();drawCompass($('compass'),S.h,S.wind,(S.spd||0)/52*9);drawMini();
  const sb=padEl.querySelector('[data-code=KeyT]');if(sb){sb.classList.toggle('on',S.sail>0);sb.querySelector('span').textContent=S.sail>=1?'Full':S.sail>0?'Half':'Struck';}
  if(near){promptEl.hidden=false;promptEl.textContent=near.kind==='port'?`Enter ${portName(near.i)}${portHostile(near.i)?' (hostile)':''}`:`Hail the ${describeShip(near.a)}`;}else promptEl.hidden=true;}
 else promptEl.hidden=true;
 const batOn=scene==='battle'&&B&&!panelOpen;bhudEl.hidden=!batOn;
 if(batOn){const T=SHIPS[B.P.t];$('bP').innerHTML=shipCardHtml(B.P,flag().name,`Your ${T.name.toLowerCase()} · ${T.guns} guns · ${(B.P.spd/70*12).toFixed(0)} knots`,true);
  const ET=SHIPS[B.E.t];$('bE').innerHTML=shipCardHtml(B.E,`${cap1(describeShip(B.ai))} '${B.ai.name}'`,`${ET.guns} guns · ${Math.round(B.E.crew)} crew · ${(B.E.spd/70*12).toFixed(0)} knots${B.E.struck?' · struck':''}`,false);
  drawCompass($('bcompass'),B.P.h,S.wind,B.P.spd/70*12);const ab=padEl.querySelector('[data-code=Tab]');if(ab)ab.querySelector('span').textContent=['Round','Chain','Grape'][B.P.ammo];
  const sb=padEl.querySelector('[data-code=KeyT]');if(sb)sb.querySelector('span').textContent=B.P.sail>=1?'Full':B.P.sail>.5?'Battle':'Reefed';
  for(const [code,side] of [['KeyQ',-1],['KeyE',1]]){const b=padEl.querySelector(`[data-code=${code}]`);if(b)b.style.opacity=(side<0?B.P.rl:B.P.rr)<=0?1:.5;}}
 const duelOn=scene==='duel'&&D&&!panelOpen;dhudEl.hidden=!duelOn;
 if(duelOn){$('dPn').textContent=`${S.name} · ${D.pc} men`;$('dEn').textContent=`${D.name} · ${D.ec} ${D.kind==='town'?'soldiers':'men'}`;$('dMark').style.left=`${(clamp(D.p,-5,5)+5)*10}%`;}
}

/* ================= main loop ================= */
let ready=false,last=performance.now(),T0=performance.now();
let RS=1,ftAcc=0,ftN=0;
function adaptRes(dt){ftAcc+=dt;ftN++;if(ftN>=40){const avg=ftAcc/ftN;ftAcc=0;ftN=0;if(avg>.03&&RS>.5)RS=Math.max(.5,RS-.1);else if(avg<.017&&RS<1)RS=Math.min(1,RS+.05);}}
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-T0)/1000;TNOW=t;
 if(ready){
  if(!panelOpen&&S&&!attract){if(scene==='sea')updateSea(dt);else if(scene==='battle')updateBattle(dt);else if(scene==='duel')updateDuel(dt);else if(scene==='map'){if(anyHit('KeyM','Escape','Enter','Space'))scene='sea';}}
  updParts(dt);adaptRes(dt);
  const rw=Math.max(64,Math.round(glCv.width*RS)),rh=Math.max(64,Math.round(glCv.height*RS));ensureTargets(rw,rh);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.s.f);gl.viewport(0,0,rw,rh);VIEWH=rh;gl.clearColor(SKY_HOR[0],SKY_HOR[1],SKY_HOR[2],1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  if(scene==='battle'&&B)renderBattle(dt,t);else if(scene==='duel'&&D)renderDuel(dt,t);else renderSea(dt,t);
  postProcess(LOOK_POST);
  if(scene!=='battle')arrowEl.hidden=true;
  ovCv.hidden=!(scene==='map'&&S&&!panelOpen);if(!ovCv.hidden)drawMapOverlay();
  labelsEl.hidden=scene!=='sea';
  const msgEl=scene==='battle'?$('bMsg'):scene==='duel'?$('dMsg'):null;const src=scene==='battle'?B:D;if(msgEl&&src){msgEl.textContent=src.msgT>0?src.msg:'';msgEl.style.opacity=clamp(src.msgT||0,0,1);}
  if(scene==='duel'&&D){flashEl.style.opacity=Math.abs(D.flash)*2.2;flashEl.style.background=D.flash>0?'rgba(245,201,79,.35)':'rgba(226,88,60,.45)';}else flashEl.style.opacity=0;
  hudT-=dt;if(hudT<=0){hudT=.1;updateHud();}
  const mode=attract||panelOpen||!S?'':scene==='map'?'':scene;setPad(mode);setHint(mode);
 }
 if(toastT>0){toastT-=dt;if(toastT<=0){toastEl.style.opacity=0;setTimeout(()=>{if(toastT<=0)toastEl.hidden=true;},400);}}
 hit.clear();requestAnimationFrame(frame);}

/* ================= boot ================= */
window.claude?.hot?.snapshot?.(()=>({S:S&&!attract?JSON.parse(JSON.stringify(S)):null}));
function start(data){
 if(!gl){$('loading').innerHTML='<div class="nogl"><h2 class="gold-t">This browser cannot draw 3D</h2><p>Turn on hardware acceleration or try another browser.</p></div>';return;}
 try{initGL();}catch(e){$('loading').textContent='The 3D renderer failed to start: '+e.message;return;}
 if(devicePixelRatio>1.5)RS=.8;
 const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});
 const imgs=Promise.all([IMG.aPort,IMG.bPort,IMG.aFace,IMG.bFace,IMG.aTorso,IMG.bTorso].map(loadImg));
 const go=()=>{imgs.then(([ap,bp,af,bf,at,bt])=>{
  PORTIMG.scarlet=ap;PORTIMG.gilded=bp;
  if(af){LOOKS.scarlet.faceT=canvasTex(af);LOOKS.scarlet.faceTA=[-.138,.138,-.215,.172];}
  if(bf){LOOKS.gilded.faceT=canvasTex(bf);LOOKS.gilded.faceTA=[-.138,.138,-.172,.112];}
  if(at){LOOKS.scarlet.torsoT=canvasTex(at);LOOKS.scarlet.torsoTA=[-.25,.25,-.04,.66];}
  if(bt){LOOKS.gilded.torsoT=canvasTex(bt);LOOKS.gilded.torsoTA=[-.25,.25,-.06,.66];}
  go2();});};
 const go2=()=>{try{const polys=buildFields();buildChart(polys);buildStatic();buildWorldMeshes();initPortraitFB();makeLabels();}catch(e){$('loading').textContent='Could not build the world: '+e.message;console.error(e);return;}
  $('loading').hidden=true;ready=true;
  if(data&&data.S){S=migrate(data.S);attract=false;cam.x=S.x;cam.z=S.y;scene='sea';}else titleScreen();};
 let done=false;const once=()=>{if(!done){done=true;setTimeout(go,30);}};
 Promise.all([document.fonts.load('700 20px "Almendra"'),document.fonts.load('14px "Alegreya Sans"')]).then(once,once);setTimeout(once,2000);
 requestAnimationFrame(frame);}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

})();
</script>
